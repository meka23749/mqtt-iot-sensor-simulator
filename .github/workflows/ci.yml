name: CI -- IIoT Sensor Simulator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 . --max-line-length=100 --exclude=.git,__pycache__

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Mosquitto broker
        run: |
          sudo apt-get install -y mosquitto
          echo "listener 1883" | sudo tee /etc/mosquitto/conf.d/local.conf
          echo "allow_anonymous true" | sudo tee -a /etc/mosquitto/conf.d/local.conf
          sudo systemctl start mosquitto
          sleep 2

      - name: Verify Mosquitto is running
        run: mosquitto_pub -h localhost -t test -m "ok"

      - name: Start FastAPI server
        run: |
          uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          sleep 3

      - name: Run MQTT tests
        run: pytest tests/test_mqtt.py -v

      - name: Run API tests
        run: pytest tests/test_api_schemathesis.py -v

      - name: Run Schemathesis fuzzing
        run: |
          python -m schemathesis.cli run http://localhost:8000/openapi.json \
            --checks all \
            --hypothesis-max-examples 30
